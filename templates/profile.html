{% extends 'base.html' %}
{% block title %}Profile • HealthPredict{% endblock %}
{% block content %}
<div class="row"><div class="col-lg-6">
<div class="glass-card">
<h3>User Profile</h3>
<form method="post" data-loading-btn>
  <label class="form-label">Name</label>
  <input class="form-control mb-2" name="name" value="{{ current_user.name }}" required>
  <label class="form-label">Username</label>
  <input class="form-control mb-2" name="username" value="{{ current_user.username }}" required>
  <label class="form-label">Email</label>
  <input class="form-control mb-2" value="{{ current_user.email }}" disabled>
  <label class="form-label">Role</label>
  <input class="form-control mb-3" value="{{ current_user.role }}" disabled>
  <button class="btn btn-primary">Update</button>
</form>
</div></div></div>
{% endblock %}
