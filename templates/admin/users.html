{% extends 'base.html' %}
{% block title %}User Management • HealthPredict{% endblock %}
{% block content %}
<h3>User Management</h3>
<form method="post" class="glass-card mb-3" data-loading-btn>
<div class="row g-2"><div class="col"><input class="form-control" name="name" placeholder="Name" required></div><div class="col"><input class="form-control" name="username" placeholder="Username" required></div><div class="col"><input class="form-control" type="email" name="email" placeholder="Email" required></div><div class="col"><input class="form-control" type="password" name="password" placeholder="Password" required></div><div class="col"><select class="form-select" name="role"><option>Patient</option><option>Doctor</option><option>Admin</option></select></div><div class="col"><button class="btn btn-success w-100">Add</button></div></div>
</form>
<div class="glass-card table-card"><table class="table table-striped mb-0"><thead><tr><th>Name</th><th>Username</th><th>Email</th><th>Role</th><th></th></tr></thead><tbody>{% for u in users %}<tr><td>{{ u.name }}</td><td>{{ u.username }}</td><td>{{ u.email }}</td><td>{{ u.role }}</td><td><a class="btn btn-sm btn-danger" href="{{ url_for('admin.delete_user', user_id=u.id) }}">Delete</a></td></tr>{% endfor %}</tbody></table></div>
{% endblock %}
