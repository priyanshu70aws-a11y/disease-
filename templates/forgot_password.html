{% extends 'base.html' %}
{% block title %}Forgot Password • HealthPredict{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-5">
  <div class="glass-card">
    <h3>Forgot Password</h3>
    <p class="text-muted">Enter your email to receive password reset guidance.</p>
    <form method="post" data-loading-btn>
      <input class="form-control mb-3" type="email" name="email" placeholder="you@example.com" required>
      <button class="btn btn-primary w-100">Send Reset Link</button>
    </form>
  </div>
</div></div>
{% endblock %}
