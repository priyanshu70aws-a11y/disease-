{% extends 'base.html' %}
{% block title %}Symptoms Selection • HealthPredict{% endblock %}
{% block content %}
<div class="glass-card">
  <h4>Symptoms Selection Page</h4>
  <p class="text-muted">Browse available symptoms used by the model dataset.</p>
  <div class="row g-2">
    {% for s in symptom_columns %}
    <div class="col-6 col-md-4 col-lg-3"><span class="soft-badge">{{ s.replace('_',' ').title() }}</span></div>
    {% endfor %}
  </div>
</div>
{% endblock %}
