<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Disease Prediction System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container">
    <a class="navbar-brand" href="{{ url_for('user.home') }}">HealthPredict</a>
    <div class="navbar-nav ms-auto">
      <a class="nav-link" href="{{ url_for('user.about') }}">About</a>
      {% if current_user.is_authenticated %}
      <a class="nav-link" href="{{ url_for('user.dashboard') }}">Dashboard</a>
      <a class="nav-link" href="{{ url_for('user.logout') }}">Logout</a>
      {% else %}
      <a class="nav-link" href="{{ url_for('user.login') }}">Login</a>
      <a class="nav-link" href="{{ url_for('user.register') }}">Register</a>
      {% endif %}
    </div>
  </div>
</nav>
<div class="container py-4">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="alert alert-{{ category }} alert-dismissible fade show">{{ message }}<button class="btn-close" data-bs-dismiss="alert"></button></div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
