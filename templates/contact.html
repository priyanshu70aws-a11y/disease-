{% extends 'base.html' %}
{% block title %}Contact • HealthPredict{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="glass-card">
      <h3>Contact Us</h3>
      <p class="text-muted">Send your question, support request, or deployment inquiry.</p>
      <form method="post" data-loading-btn>
        <div class="row g-2">
          <div class="col-md-6"><input class="form-control" name="name" placeholder="Your Name" required></div>
          <div class="col-md-6"><input class="form-control" type="email" name="email" placeholder="Your Email" required></div>
          <div class="col-12"><input class="form-control" name="subject" placeholder="Subject" required></div>
          <div class="col-12"><textarea class="form-control" name="message" rows="5" placeholder="Write your message" required></textarea></div>
          <div class="col-12"><button class="btn btn-primary">Send Message</button></div>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
