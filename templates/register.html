{% extends 'base.html' %}
{% block title %}Register • HealthPredict{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="glass-card">
      <h3>Create Account</h3>
      <form method="post" data-loading-btn novalidate>
        <input class="form-control mb-2" type="text" name="name" placeholder="Full Name" required>
        <input class="form-control mb-2" type="text" name="username" placeholder="Username" required>
        <input class="form-control mb-2" type="email" name="email" placeholder="Email" required>
        <input class="form-control mb-2" type="password" id="regPassword" name="password" placeholder="Password" minlength="6" required>
        <div class="mb-2"><button class="btn btn-sm btn-outline-secondary" type="button" data-toggle-password="regPassword">Show</button></div>
        <select class="form-select mb-3" name="role" required><option>Patient</option><option>Doctor</option></select>
        <button class="btn btn-success w-100">Create Account</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
