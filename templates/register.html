{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-7">
<h3>Register</h3>
<form method="post" class="card card-body" novalidate>
  <input class="form-control mb-3" type="text" name="name" placeholder="Full Name" required>
  <input class="form-control mb-3" type="email" name="email" placeholder="Email" required>
  <input class="form-control mb-3" type="password" name="password" placeholder="Password" minlength="6" required>
  <select class="form-select mb-3" name="role" required>
    <option>Patient</option><option>Doctor</option><option>Admin</option>
  </select>
  <button class="btn btn-success">Create Account</button>
</form></div></div>
{% endblock %}
