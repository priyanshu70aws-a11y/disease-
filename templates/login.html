{% extends 'base.html' %}
{% block title %}Login • HealthPredict{% endblock %}
{% block content %}
<section class="auth-wrap">
  <div class="auth-card fade-in">
    <div class="d-flex align-items-center mb-3 gap-2">
      <div class="auth-logo"><i class="bi bi-shield-lock"></i></div>
      <div>
        <h3 class="mb-0">Welcome Back</h3>
        <small class="text-muted">Login to your healthcare dashboard</small>
      </div>
    </div>

    <form method="post" data-loading-btn novalidate>
      <div class="mb-3">
        <label class="form-label">Email or Username</label>
        <input class="form-control" type="text" name="identity" placeholder="doctor@hospital.com or username" required>
      </div>
      <div class="mb-2">
        <label class="form-label">Password</label>
        <div class="input-group">
          <input class="form-control" id="password" type="password" name="password" required>
          <button class="btn btn-outline-secondary" type="button" data-toggle-password="password">Show</button>
        </div>
      </div>
      <div class="d-flex justify-content-between align-items-center mb-3">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" name="remember_me" id="rememberMe">
          <label class="form-check-label" for="rememberMe">Remember Me</label>
        </div>
        <a href="{{ url_for('user.forgot_password') }}" class="small">Forgot Password?</a>
      </div>
      <button class="btn btn-primary w-100" type="submit">Login</button>
    </form>

    <p class="mt-3 mb-0 text-center text-muted">No account? <a href="{{ url_for('user.register') }}">Create one</a></p>
  </div>
</section>
{% endblock %}
